name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ADR 0003 §7 / Phase 3: the iteration-19 vague-generic-naming
      # check — the first rstui-specific lint, the one defect class
      # clippy/rustdoc cannot see. Same command run locally
      # (.cargo/config.toml alias). See docs/conventions/naming.md.
      - name: Naming
        run: cargo xtask lint-names

      # ADR 0003 §4 / Phase 1: the rustdoc gate. Closes the silent-failure
      # gap where broken intra-doc links and missing docs on new public
      # items previously passed CI. RUSTDOCFLAGS is scoped to this step so
      # it does not alter the doctest run in Test.
      - name: Docs
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Test
        run: cargo test --all-features

  # ADR 0003 §8 / Phase 3: the MSRV compatibility leg. Separate job, *not*
  # part of the 5-gate fast loop (`cargo xtask ci`) — its only job is to
  # catch new-language-feature creep past the declared `rust-version`,
  # cheaply, on one pinned toolchain (the ratatui model the ADR cites).
  msrv:
    name: msrv (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this pinned to `[workspace.package] rust-version` in Cargo.toml.
      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --workspace --all-targets --all-features

  # ADR 0003 §7 / Phase 3: the unused-dependency hygiene leg (reinforces
  # "do not add dependencies speculatively"). Separate job — needs an
  # external tool, so it stays out of the dependency-free `xtask` fast loop.
  unused-deps:
    name: unused-deps (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete

  # ADR 0003 §7 / Phase 3: the supply-chain leg (cargo-deny). Separate job —
  # needs an external tool, so it stays out of the dependency-free `xtask`
  # fast loop. Advisories started non-blocking (ADR 0003 §7) and are now
  # **promoted to gating** (the planned later slice): a known vulnerability,
  # unsound, or yanked crate fails CI. The escape hatch is a reviewed,
  # rationale-commented `[advisories] ignore` entry in `deny.toml`, never
  # silent suppression. Config + the license allow-list live in `deny.toml`.
  supply-chain:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo-deny (advisories, licenses, bans, sources — all gating)
        run: cargo deny check

  # Release-packaging smoke test: `cargo package` every publishable crate as
  # one set (so intra-workspace path+version deps resolve). Catches a
  # crates.io-required field gone missing / a mis-included file *before* a
  # release tag. Separate job — packaging, not building (that is the `check`
  # job's `cargo xtask ci`); same command locally via `cargo xtask
  # publish-check`. See docs/development.md.
  package:
    name: package (publish-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo package (all publishable crates)
        run: cargo xtask publish-check
