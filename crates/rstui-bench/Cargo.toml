[package]
name = "rstui-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "rstui hot-path benchmark runner: a dependency-free, deterministic timing harness over rstui-core's public API, driven by `cargo xtask bench`."

[lints]
workspace = true

# No external dependency by design, mirroring `xtask` (ADR 0003 §7) and
# ADR 0005: the benchmark runner must not pull a benchmarking framework.
# Only **first-party rstui crates** + std are built here — never an external
# crate. ADR 0005 follow-up #3 explicitly sanctions wiring widget-render
# hot paths "as their surfaces stabilize, still through the public API
# only"; `rstui-widgets` is added for the `widget/*/render` scenarios and is
# itself a `rstui-core`-only crate, so the "rstui code plus std" property
# holds.
[dependencies]
rstui-core = { path = "../rstui-core" }
rstui-widgets = { path = "../rstui-widgets" }
# `runtime/frame/*` drives a representative App through the public headless
# `Harness` (the same one the test suite uses) to measure the end-to-end
# view→diff→flush frame cost — the bench-gap the audit flagged. First-party,
# `rstui-core`-only crate, so "rstui code plus std" still holds.
rstui-runtime = { path = "../rstui-runtime" }
