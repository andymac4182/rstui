[package]
name = "rstui-crossterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The crossterm-backed terminal driver for the rstui TUI framework: the Backend impl, terminal lifecycle, and crossterm <-> rstui event translation."

[lints]
workspace = true

[dependencies]
rstui-core = { path = "../rstui-core" }
# The full-screen app shell (`run_app`) composes `rstui_runtime::run` with the
# guard + backend + event source, so the runtime is a normal dependency, not
# just a dev one. This is acyclic by design — `rstui-runtime` depends only on
# `rstui-core`, never on `rstui-crossterm` — so the backend crate is free to
# sit on top of the runtime and own the terminal-specific entry point.
rstui-runtime = { path = "../rstui-runtime" }
# The single external dependency in the workspace, deliberately isolated here
# per ADR 0001 so `rstui-core` stays dependency-free. Default features (incl.
# `windows`) are kept on for the cross-platform support that motivated the
# decision; the sync input source uses only the always-on `events` feature, so
# no feature change was needed for it (an async `event-stream` is a future opt).
crossterm = "0.29"
# Termination-signal terminal restore (see `signal`). `signal-hook` is already
# *transitively* in the tree — crossterm's `events` feature pulls
# `signal-hook-registry`/`signal-hook-mio` for its own SIGWINCH/resize handling
# — but those are the low-level registry, not the safe blocking iterator. The
# direct dep is scoped to exactly one concern (restore the terminal on
# SIGTERM/SIGHUP/SIGINT/SIGQUIT), stays inside this ADR 0001 backend crate so
# `rstui-core` keeps zero dependencies, and buys the `iterator::Signals` thread
# API specifically so the restore runs *off* the async-signal handler with no
# `unsafe` (the workspace forbids `unsafe_code`).
signal-hook = "0.3"
