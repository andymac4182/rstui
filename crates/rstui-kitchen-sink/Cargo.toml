[package]
name = "rstui-kitchen-sink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The rstui kitchen-sink: one fully interactive, multi-screen, full-colour terminal app that exercises every widget with live keyboard + mouse, and doubles as a deterministic Harness-driven snapshot test of the whole stack."

[lints]
workspace = true

# Same shape as `rstui-smoke`: a demo/app crate that spans every stream by
# depending on the public API of core + widgets + runtime together, so a
# cross-crate regression fails `cargo test` here. It is `publish = false`
# (an application, not a library), so path deps need no `version` and it is
# excluded from `cargo xtask publish-check`.
[dependencies]
rstui-core = { path = "../rstui-core" }
rstui-widgets = { path = "../rstui-widgets" }
rstui-runtime = { path = "../rstui-runtime" }
# The shared keymap engine (extracted from this crate's former local
# module so the ACP client can use the exact same model — ADR 0015).
rstui-keymap = { path = "../rstui-keymap" }
# The full-screen entry point (`run_app`) lives here; it owns the alternate
# screen, raw mode, mouse + paste + focus capture, and panic-safe restore.
rstui-crossterm = { path = "../rstui-crossterm" }
# Every gpui-component theme as a terminal palette; `RSTUI_THEME` skins the
# whole app with any of them, so the kitchen sink also demos the theme system.
rstui-theme = { path = "../rstui-theme" }
# Opt-in in-app perf/DevTools overlay (ADR 0018), wired live through the
# crossterm `run_app_with_observer` seam; `F12` toggles it. The kitchen
# sink is the worked reference for hooking DevTools into a real app.
rstui-devtools = { path = "../rstui-devtools" }
# The declarative agent-UI engine (A2UI + json-render); the two Agent UI
# scenes render an agent's document through it (ADR 0017). `serde_json`
# parses the json-render spec the demo feeds the engine.
rstui-jsonui = { path = "../rstui-jsonui" }
serde_json = { version = "1", default-features = false, features = ["std"] }
