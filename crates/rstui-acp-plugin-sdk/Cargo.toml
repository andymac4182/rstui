[package]
name = "rstui-acp-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# An SDK crate for *writing* rstui-acp-client plugins in Rust. It owns the
# whole communications stack (JSON-RPC 2.0 framing + transport + dispatch),
# so a plugin only writes handlers. publish=false: it ships with the app,
# not as a standalone library (yet), like the other non-library crates.
publish = false
description = "Rust SDK for rstui-acp-client plugins: JSON-RPC 2.0 over stdio/websocket, transport-agnostic, the plugin writes only handlers."

[lints]
workspace = true

[dependencies]
# The app-agnostic plugin framework (ADR 0021): JSON-RPC envelope, every
# transport, and the Protocol-generic serve loop. This SDK adds only the
# ACP vocabulary (`proto`) + ergonomics on top, and re-exports core so
# downstream paths are unchanged.
rstui-plugin-core = { path = "../rstui-plugin-core" }
# `proto` uses serde derive + serde_json directly. std-only otherwise.
# MIT/Apache (deny-allowed), already in the workspace graph.
serde = { version = "1", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1", default-features = false, features = ["std"] }
