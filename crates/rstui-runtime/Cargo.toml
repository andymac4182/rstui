[package]
name = "rstui-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Elm-style App/Cmd runtime and deterministic headless harness for the rstui TUI framework."

[lints]
workspace = true

[features]
# Off by default: the synchronous runtime never depends on tokio (ADR 0001,
# ADR 0011). Opt in with `--features async` for the `tokio::select!`-driven
# async event loop (`run_async`, `AsyncEventSource`); the default build, the
# headless `Harness`, `run`, `run_threaded`, and `run_pooled` stay
# dependency-free and unchanged.
async = ["dep:tokio"]

[dependencies]
# `version` (not just `path`) so this crate is publishable to crates.io —
# a bare path dep makes a public crate unpublishable. Kept equal to the
# workspace version by the `crate_dep_versions_match_workspace` xtask guard.
rstui-core = { path = "../rstui-core", version = "0.0.1" }
# The single, OPTIONAL, scoped dependency — only compiled with `--features
# async`. The async event loop needs exactly: `rt`
# (spawn/spawn_blocking), `sync` (the `mpsc` command-result channel the loop
# `select!`s on), `time` (tick `interval` + `sleep` for `Cmd::tick`/`every`),
# `macros` (`select!` and `#[tokio::test]`), and `test-util` (paused virtual
# time so the async loop is tested deterministically with no real clock — the
# determinism mandate the sync `Harness` also serves). The brief forbids a
# *casual* broad async dep; this is feature-gated, justified, documented
# (ADR 0011), and the default build is untouched.
tokio = { version = "1", optional = true, default-features = false, features = [
    "rt",
    "sync",
    "time",
    "macros",
    "test-util",
] }
