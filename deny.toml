# cargo-deny — the supply-chain gate (ADR 0003 §7, Phase 3).
#
# Local:  cargo deny check
# CI:     the `supply-chain` job (.github/workflows/ci.yml). All four checks
#         — advisories, licenses, bans, sources — are now the *hard* gate.
#         Advisories started non-blocking (ADR 0003 §7) and were promoted
#         here in the planned later slice. The escape hatch for a triaged
#         advisory is a rationale-commented entry in `[advisories] ignore`
#         below — a reviewed decision in-tree, never silent suppression.

[graph]
# Match what CI builds (`--all-features`), so the gate sees the real graph.
all-features = true

[advisories]
version = 2
# RustSec DB. Vulnerabilities and unsound/unmaintained advisories fail the
# gate; a yanked crate is a real supply-chain signal and also fails.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Escape hatch: to ship past a triaged advisory, add it here with a
# one-line rationale — what it is, why it is acceptable here, who decided,
# when to revisit. An empty list is the goal state; an entry is a debt:
#   ignore = [
#     "RUSTSEC-0000-0000", # <crate>: not reachable (no <feature>); revisit on bump — owner, 2026-05-17
#   ]
ignore = []

[licenses]
version = 2
# The exact set present in the dependency graph, surveyed with
# `cargo deny list`. rstui itself is Apache-2.0; dependencies add MIT, the
# Apache LLVM exception, and Unicode-3.0 (unicode-ident). No copyleft is
# present and none is allowed: a new dependency under any other license
# fails the gate until the license is reviewed and added here — that review
# is exactly the point of the gate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate transitive versions are usually benign; surface them without
# failing the gate (a hard deny here is brittle churn — ADR 0003's explicit
# non-goal). Genuine wildcard version requirements are denied; workspace
# path dependencies legitimately have none.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Supply-chain core: every crate must resolve from crates.io. An unknown
# registry or any git dependency fails the gate until explicitly vetted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
